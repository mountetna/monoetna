name: Build and upload staging images
on:
  push:
    branches:
      - staging

# Ensure only one of these builds at a given time.
concurrency:
  group: staging-build
  cancel-in-progress: true

jobs:
  build-staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-app:
          - etna
          - magma
          - metis
          - janus
          - gnomon
          - polyphemus
          - vulcan
          - timur
          - vesta
          - janus/janus_app_fe
          - gnomon/gnomon_app_fe
          - polyphemus/polyphemus_app_fe
          - timur/timur_app_fe
          - vulcan/vulcan_app_fe
          - metis/metis_app_fe
          - vesta/vesta_ui
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: docker login
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: docker login -p "${DOCKER_TOKEN}" -u etnaagent
      - name: Build & Push staging tag images to dockerhub
        env:
          IS_CI: 1
          PUSH_IMAGES: 1
          IMAGES_PREFIX: etnaagent/
          IMAGES_POSTFIX: :staging
          NO_TEST: 1
          # Space-delimited app names to build with docker/etna-base-dev/Dockerfile.ruby34.
          # Example: "metis timur"
          RUBY34_ROLLOUT_APPS: ""
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          APP="${{ matrix.test-app }}"
          PARTS=(${APP/\// })
          IMGNAME=${PARTS[1]}
          TAG=${IMAGES_PREFIX}${IMGNAME}${IMAGES_POSTFIX}
          if [[ " ${RUBY34_ROLLOUT_APPS} " == *" ${APP} "* ]]
          then
            export USE_RUBY34_IMAGE=1
            echo "Building $APP with Ruby 3.4 base image"
          else
            export USE_RUBY34_IMAGE=0
            echo "Building $APP with Ruby 2.7 base image"
          fi
          if [[ $APP =~ "vesta_ui" ]]
          then
            cd $APP
            docker build -t $TAG .
            docker push $TAG
          else
            make -C ${{ matrix.test-app }} release
          fi
